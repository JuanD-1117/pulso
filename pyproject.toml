[project]
name = "pulso"
version = "3.2.1"
description = "Redes complejas, sincronización y riesgo sistémico y crediticio en sistemas de pagos digitales: del modelo físico a la aplicación."
readme = "README.md"
authors = [
    { name = "Juan Diego Martínez Ayala", email = "juandiegom330@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "numba>=0.68.1",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pyarrow>=26.0.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "shap>=0.54.1",
    "streamlit>=1.67.0",
    "torch>=2.15.0",
    "torch-geometric>=2.8.1",
    "xgboost>=3.4.1",
]

[project.scripts]
pulso = "pulso.cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "nbconvert>=7.17.2",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

# En Linux (CI, Docker, despliegue) se usa la rueda CPU de torch: la de CUDA pesa ~2 GB.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # tildes y letras griegas en docstrings

[tool.ruff.lint.per-file-ignores]
# Tablas Markdown y LaTeX: partir las líneas cambia el render.
"app/Inicio.py" = ["E501"]
"app/pages/7_Acerca_del_modelo.py" = ["E501"]
"app/pages/8_Cartera_multicapa.py" = ["E501"]
"app/pages/9_Riesgo_crediticio_híbrido.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]  # no depender del .pth editable (macOS lo oculta en ~/Documents)
addopts = "-ra"
markers = ["slow: pruebas que tardan más de unos segundos"]
filterwarnings = ["ignore::FutureWarning:torch.*", "ignore::DeprecationWarning:torch_geometric.*"]
